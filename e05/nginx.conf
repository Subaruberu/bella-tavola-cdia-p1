# nginx.conf — proxy reverso para a API Bella Tavola
#
# O Nginx recebe todas as requisições externas (porta 80) e as repassa
# para o uvicorn (porta 8000 na rede interna do Compose).
# A API não fica exposta diretamente — o Nginx é a única entrada pública.
#
# Fluxo:  Usuário → porta 80 → Nginx → porta 8000 (rede interna) → uvicorn

server {
    listen 80;

    # proxy_pass usa o NOME DO SERVIÇO como hostname, não localhost.
    # O DNS interno do Compose resolve 'api' para o IP do contêiner da API.
    # Isso funciona porque Nginx e API estão na mesma rede do Compose.
    location / {
        proxy_pass http://api:8000;

        # Repassa o host original da requisição para a API
        proxy_set_header Host $host;

        # Repassa o IP real do cliente (sem isso, a API vê apenas o IP do Nginx)
        proxy_set_header X-Real-IP $remote_addr;

        # Encaminha a cadeia de proxies para rastreabilidade
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informa que a requisição veio via HTTP (útil para a API saber o protocolo original)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configurações de timeout — importante para endpoints lentos como /ml/predict
    # que faz download do modelo no primeiro acesso
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
}

# ─────────────────────────────────────────────────────────────────────────────
# Para produção, considere adicionar:
#
# Compressão (respostas JSON menores):
#   gzip on;
#   gzip_types application/json text/plain;
#
# Rate limiting (evitar abuso):
#   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
#   limit_req zone=api burst=20 nodelay;
#
# HTTPS (bloco server na porta 443 com certificados):
#   listen 443 ssl;
#   ssl_certificate /etc/nginx/ssl/cert.pem;
#   ssl_certificate_key /etc/nginx/ssl/key.pem;
# ─────────────────────────────────────────────────────────────────────────────
